name = "murty_simon"
version = "0.1.0"
defaultTargets = ["MurtySimon", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "MurtySimon"
globs = ["MurtySimon.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
